[package]
name = "mystudy-worker"
version = "0.1.0"
edition = "2021"
description = "MyStudy v2 API worker: auth (TOTP + security questions), News, Paystack-ready premium stubs. Rust -> WASM on Cloudflare Workers."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.9", features = ["d1"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = "0.12"
getrandom = { version = "0.3", features = ["wasm_js"] }
base64 = "0.22"

[dev-dependencies]
